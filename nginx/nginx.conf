server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /login {
        alias /usr/share/nginx/html/login;
        try_files $uri $uri/ /login/index.html;
    }

    location /register {
        alias /usr/share/nginx/html/register;
        try_files $uri $uri/ /register/index.html;
    }

    # Configuración para manejar archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires max;
        log_not_found off;
    }
}